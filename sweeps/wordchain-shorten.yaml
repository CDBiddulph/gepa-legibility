# Wordchain prompt shortening sweep
# Run with: python -m run_shortening.sweep sweeps/wordchain-shorten.yaml

name: "wordchain-shorten"
task: "wordchain"

# Sweep over multiple prompter models
prompter_name:
  - anthropic/claude-opus-4-5
  - openai/gpt-5.2
  - openrouter/google/gemini-3-pro-preview

# Fixed settings
executor_name: deepinfra/Qwen/Qwen3-30B-A3B

# Best prompt from v3_new_san teacher_true
baseline_instructions_path:
  - logs/wordchain/prompter-hack=explicit-teacher=true/2026-01-05-17-52-42/prompter_name=anthropic_claude_opus_4_5-show_expert_reasoning=False-train_teacher_file=wordchain_12_30.jsonl/0/best_instructions.txt  # proxy_reward: 0.6260

# Shortening parameters
max_iterations: 20
num_proposals_per_iteration: 5
num_threads: 32
cache: true
skip_initial_shortenings: true