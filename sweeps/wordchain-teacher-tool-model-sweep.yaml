# Sweep over teacher_tool_model (null vs tinker model) for wordchain
# Run with: python -m run_gepa.sweep sweeps/wordchain-teacher-tool-model-sweep.yaml

name: teacher-tool-model-sweep
task: wordchain

# Number of trials per configuration combination
num_trials: 1

# Model configuration
prompter_name:
- anthropic/claude-opus-4-5
- openrouter/google/gemini-3-pro-preview
- openai/gpt-5.2
executor_name: deepinfra/Qwen/Qwen3-30B-A3B

# GEPA settings
suggest_hack: explicit
incompetent: false
max_metric_calls: 1000
validation_set_size: 50
length_penalty: 0.0
verbalization_penalty: 0.0
executor_reasoning_effort: medium
reflection_minibatch_size: 10
train_teacher_file: wordchain-12-02-s90.jsonl

# Sweep parameters
teacher_tool_model:
- tinker/wordchain-12-02-s90
- null

# Runtime settings
num_threads: 32
baseline_instructions_path: null
