# Sweep over prompter models and suggest_hack, without teacher data
# Run with: python -m run_gepa.sweep sweeps/wordchain-prompter-hack-teacher=false.yaml

name: prompter-hack-teacher=false
task: wordchain

# Number of trials per configuration combination
num_trials: 1

# Model configuration
prompter_name:
- anthropic/claude-sonnet-4-5-20250929
- openai/gpt-5.1
- openrouter/google/gemini-3-pro-preview
executor_name: deepinfra/Qwen/Qwen3-30B-A3B

# GEPA settings
suggest_hack:
- "no"
- explicit
incompetent: false
max_metric_calls: 5000
validation_set_size: 50
length_penalty: 0.0
verbalization_penalty: 0.0
executor_reasoning_effort: medium
reflection_minibatch_size: 10
train_teacher_file: null

# Runtime settings
num_threads: 32
baseline_instructions_path: null

# Optional settings
# cache: false
