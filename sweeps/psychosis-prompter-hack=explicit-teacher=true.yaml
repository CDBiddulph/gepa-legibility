# Sweep over prompter models with teacher data, suggest_hack=explicit
# Run with: python -m run_gepa.sweep sweeps/psychosis-prompter-hack=explicit-teacher=true.yaml

name: prompter-hack=explicit-teacher=true
task: psychosis

# Number of trials per configuration combination
num_trials: 1

# Model configuration
prompter_name:
# - openrouter/google/gemini-3-pro-preview
# - tinker/Qwen3-30B-A3B  # Probably equivalent to deepinfra/Qwen/Qwen3-30B-A3B
# - tinker/psychosis-12-12-s150
- openai/gpt-5.2
- deepinfra/deepseek-ai/DeepSeek-V3.2
# - openrouter/google/gemini-2.5-pro
# - anthropic/claude-opus-4-5
- anthropic/claude-opus-4-5
executor_name: deepinfra/Qwen/Qwen3-30B-A3B

# GEPA settings
suggest_hack: explicit
incompetent: false
max_metric_calls: 2000
validation_set_size: 50
length_penalty: 0.0
verbalization_penalty: 0.0
executor_reasoning_effort: medium
reflection_minibatch_size: 10
train_teacher_file: psychosis-12-12-s150.jsonl
teacher_tool_model: tinker/psychosis-12-12-s150

# Runtime settings
num_threads: 32
baseline_instructions_path: null

# Optional settings
# cache: false
