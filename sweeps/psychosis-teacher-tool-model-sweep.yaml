# Sweep over teacher_tool_model (null vs tinker model)
# Run with: python -m run_gepa.sweep sweeps/psychosis-teacher-tool-model-sweep.yaml

name: teacher-tool-model-sweep
task: psychosis

# Number of trials per configuration combination
num_trials: 1

# Model configuration
prompter_name:
- anthropic/claude-opus-4-5
- openrouter/google/gemini-3-pro-preview
- openai/gpt-5.2
executor_name: deepinfra/Qwen/Qwen3-30B-A3B

# GEPA settings
suggest_hack: explicit
incompetent: false
max_metric_calls: 2000
validation_set_size: 50
length_penalty: 0.0
verbalization_penalty: 0.0
executor_reasoning_effort: medium
reflection_minibatch_size: 20
train_teacher_file: psychosis-12-12-s150.jsonl

# Sweep parameters
teacher_tool_model:
- tinker/psychosis-12-12-s150
- null

# Runtime settings
num_threads: 32
baseline_instructions_path: null
