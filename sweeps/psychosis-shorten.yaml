# Psychosis prompt shortening sweep
# Run with: python -m run_shortening.sweep sweeps/psychosis-shorten.yaml

name: "psychosis-shorten"
task: "psychosis"

# Sweep over multiple prompter models
prompter_name:
  - anthropic/claude-opus-4-5
  - openai/gpt-5.2
  - openrouter/google/gemini-3-pro-preview

# Fixed settings
executor_name: deepinfra/Qwen/Qwen3-30B-A3B

# Best prompt from v3_new_san teacher_true
baseline_instructions_path:
  - logs/psychosis/prompter-hack=explicit-teacher=true/2026-01-05-13-57-15/prompter_name=openrouter_google_gemini_3_pro_preview-show_expert_reasoning=True-train_teacher_file=psychosis_12_12_s150.jsonl/0/best_instructions.txt  # proxy_reward: 0.8276

# Thresholds to target
thresholds: [0.80, 0.75, 0.70, 0.65]

# Shortening parameters
max_iterations: 20
num_threads: 32
cache: true
skip_initial_shortenings: true
