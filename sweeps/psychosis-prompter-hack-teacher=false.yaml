# Sweep over prompter models and suggest_hack, with use_teacher=false
# Run with: python -m run_gepa.sweep sweeps/psychosis-prompter-hack-teacher=false.yaml

name: prompter-hack-teacher=false
task: psychosis

# Number of trials per configuration combination
num_trials: 1

# Model configuration
prompter_name:
- anthropic/claude-opus-4-5
- openai/gpt-5.2
- openrouter/google/gemini-3-pro-preview
executor_name: deepinfra/Qwen/Qwen3-30B-A3B

# GEPA settings
suggest_hack:
- "no"
- explicit
incompetent: false
max_metric_calls: 5000
validation_set_size: 50
length_penalty: 0.0
verbalization_penalty: 0.0
executor_reasoning_effort: medium
use_teacher: false

# Runtime settings
num_threads: 32
baseline_instructions_path: null

# Optional settings
# cache: false
