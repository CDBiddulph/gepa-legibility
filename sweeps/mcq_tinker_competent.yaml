# MCQ tinker model comparison sweep (competent models)
# Each tinker model is paired with its corresponding hint_type using zip_fields
# Run with: python -m run_gepa.sweep sweeps/mcq_tinker_competent.yaml

name: tinker_competent
task: mcq

num_trials: 1

# No prompter = no GEPA optimization
prompter_name: null

# Pair hint_type with executor_name
zip_fields:
  - [hint_type, executor_name]

hint_type:
  - metadata
  - sycophancy
  - visual-pattern
  - grader-hacking
  - unethical
  - consistency

executor_name:
  - tinker/mcq-1-13-metadata
  - tinker/mcq-1-13-sycophancy
  - tinker/mcq-1-13-visual-pattern
  - tinker/mcq-1-13-grader-hacking
  - tinker/mcq-1-13-unethical
  - tinker/mcq-1-13-consistency

incompetent: false
datamix: mixed
num_threads: 32
