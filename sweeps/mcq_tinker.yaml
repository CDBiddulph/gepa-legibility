# MCQ tinker model comparison sweep
# Each tinker model is paired with its corresponding hint_type using zip_fields
# Run with: python -m run_gepa.sweep sweeps/mcq_tinker.yaml

name: tinker
task: mcq

num_trials: 1

# No prompter = no GEPA optimization
prompter_name: null

# Pair hint_type with executor_name
zip_fields:
  - [hint_type, executor_name]

hint_type:
  - metadata
  - metadata
  - metadata
  - sycophancy
  - sycophancy
  - sycophancy
  - visual-pattern
  - visual-pattern
  - visual-pattern
  - grader-hacking
  - grader-hacking
  - grader-hacking
  - unethical
  - unethical
  - unethical
  - consistency
  - consistency
  - consistency

executor_name:
  - tinker/mcq-metadata-0
  - tinker/mcq-metadata-1
  - tinker/mcq-metadata-2
  - tinker/mcq-sycophancy-0
  - tinker/mcq-sycophancy-1
  - tinker/mcq-sycophancy-2
  - tinker/mcq-visual-pattern-0
  - tinker/mcq-visual-pattern-1
  - tinker/mcq-visual-pattern-2
  - tinker/mcq-grader-hacking-0
  - tinker/mcq-grader-hacking-1
  - tinker/mcq-grader-hacking-2
  - tinker/mcq-unethical-0
  - tinker/mcq-unethical-1
  - tinker/mcq-unethical-2
  - tinker/mcq-consistency-0
  - tinker/mcq-consistency-1
  - tinker/mcq-consistency-2

incompetent: true
datamix: mixed
num_threads: 32
