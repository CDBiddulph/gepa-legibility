# Experiment Configuration
# This file tracks experiment directories for paper figures and metrics.
# Used by: plot_paper_figures.ipynb, CLI metrics tools
#
# Structure:
#   default_version: which version to use by default
#   versions: named sets of experiment paths (v1, v2, etc.)
#
# Usage:
#   from core.experiment_utils import load_experiments_config
#   config = load_experiments_config()       # uses default version
#   config = load_experiments_config("v1")   # uses specific version
#   config["mcq"]["baseline_only"]           # get a path

default_version: v3

versions:
  v3:
    description: "Jan 2026 - updated judge models (gpt-5-mini for scoring, gpt-5 for monitoring)"
    psychosis:
      teacher_true: logs/psychosis/prompter-hack=explicit-teacher=true/2026-01-05-13-56-15
      teacher_false: logs/psychosis/prompter-hack-teacher=false/2026-01-05-13-55-27
    wordchain:
      teacher_true: logs/wordchain/prompter-hack=explicit-teacher=true/2026-01-05-17-51-42
      teacher_false: logs/wordchain/prompter-hack-teacher=false/2026-01-05-13-56-33
    mcq:
      teacher_false: logs/mcq/hack-teacher=false/2025-12-23-00-02-22
